[project]
name = "pytorch-for-deep-learning"
version = "0.1.0"
description = "Entorno de desarrollo para el curso de PyTorch para Deep Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision",
    "torchaudio",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "ipykernel",
    "tqdm",
]

[dependency-groups]
dev = [
    "jupyter",
]
